app = "receipesharingplatform"
primary_region = "ord"  # change if you picked another region

[build]
  # We’ll tell Fly to use a Dockerfile (see below)

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
